<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  #c{width:1024px;height:1024px}
</style></head>
<body>
<!-- 1024x1024 macOS-style icon. Rounded squircle, gradient, stacked "story" pages + spark. -->
<svg id="c" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4b2fd6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6ff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#1c1240" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app squircle background -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- stacked story cards -->
  <g filter="url(#sh)">
    <rect x="300" y="250" width="430" height="540" rx="46" fill="#cfc6ff" opacity="0.55" transform="rotate(-9 512 512)"/>
    <rect x="300" y="250" width="430" height="540" rx="46" fill="#e3ddff" opacity="0.8" transform="rotate(-4 512 512)"/>
    <rect x="300" y="250" width="430" height="540" rx="46" fill="url(#page)"/>
  </g>

  <!-- text lines on the front card -->
  <g fill="#b9aeff">
    <rect x="356" y="330" width="318" height="34" rx="17"/>
    <rect x="356" y="398" width="318" height="22" rx="11" fill="#d7d0ff"/>
    <rect x="356" y="446" width="240" height="22" rx="11" fill="#d7d0ff"/>
  </g>

  <!-- spark / play mark -->
  <g transform="translate(512 600)">
    <circle r="118" fill="#7c5cff"/>
    <path d="M -34 -56 L 64 0 L -34 56 Z" fill="#ffffff"/>
  </g>
</svg>
</body>
</html>
